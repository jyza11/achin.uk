# ════════════════════════════════════════════════════════
#  Netlify Config — Achin Portfolio
#  Build · Security · Performance · DevSecOps
# ════════════════════════════════════════════════════════

# ─── Build settings ─────────────────────────────────────
[build]
  command   = "npm run build"
  publish   = "build"
  functions = ".netlify/functions-internal"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS    = "--no-audit --no-fund --prefer-offline"

# ─── Branch-specific deploys ────────────────────────────
[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"


# ════════════════════════════════════════════════════════
#  SECURITY HEADERS (apply to every response)
# ════════════════════════════════════════════════════════
[[headers]]
  for = "/*"
  [headers.values]
    # Stop click-jacking — site cannot be embedded in iframes
    X-Frame-Options = "DENY"

    # Block MIME-sniffing — browser must trust declared Content-Type
    X-Content-Type-Options = "nosniff"

    # Don't leak full URL when user clicks an outbound link
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Force HTTPS for 2 years, include subdomains, eligible for HSTS preload list
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # Disable browser features we don't use (camera, mic, geolocation, etc.)
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

    # Content Security Policy — defence-in-depth against XSS
    # NOTE: 'unsafe-inline' for styles is required by Skeleton UI v2.
    # When Stripe is wired in Phase 3, this CSP already permits Stripe.js + Stripe API.
    Content-Security-Policy = '''
      default-src 'self';
      img-src 'self' data: https:;
      font-src 'self' data:;
      style-src 'self' 'unsafe-inline';
      script-src 'self' https://js.stripe.com;
      connect-src 'self' https://api.stripe.com;
      frame-src 'self' https://js.stripe.com https://hooks.stripe.com;
      form-action 'self';
      base-uri 'self';
      object-src 'none';
      upgrade-insecure-requests;
    '''

    # Cross-Origin isolation (relaxed — tighten if not embedding 3rd-party)
    Cross-Origin-Opener-Policy = "same-origin"


# ════════════════════════════════════════════════════════
#  CACHE HEADERS — performance
# ════════════════════════════════════════════════════════

# SvelteKit hashed assets: safe to cache forever
[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static images — cache 1 day, allow stale revalidation
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Favicon — cache 1 week
[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML — never cache aggressively (must revalidate)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"


# ════════════════════════════════════════════════════════
#  REDIRECTS
# ════════════════════════════════════════════════════════

# Force apex/www consolidation — pick ONE canonical host
# Uncomment + edit when domain is finalized:
# [[redirects]]
#   from = "https://www.achin.uk/*"
#   to   = "https://achin.uk/:splat"
#   status = 301
#   force  = true

# Block access to source-map files in production (don't leak internals)
[[redirects]]
  from = "/*.js.map"
  to   = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/*.css.map"
  to   = "/404"
  status = 404
  force = true


# ════════════════════════════════════════════════════════
#  FUNCTIONS (for future Stripe routes)
# ════════════════════════════════════════════════════════
[functions]
  # Run Node 20 inside Netlify Functions to match build env
  node_bundler = "esbuild"

  # External packages that shouldn't be bundled (uncomment when used):
  # external_node_modules = ["stripe"]
