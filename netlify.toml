# ════════════════════════════════════════════════════════════════
#  Netlify — achin.uk
#  Merged 2026-09-15 from the old `master` file (explained security headers) and `deploy`
#  (Node 22, API host, /admin noindex, prerender + snapshot notes). Checked against
#  adapter-netlify 5.2.4 and the live site's response headers.
# ════════════════════════════════════════════════════════════════

# ─── Build ───────────────────────────────────────────────────────
[build]
  command = "npm run build"
  # The adapter reads this value and writes the site here.
  publish = "build"
  # No `functions` key: the adapter writes its function to .netlify/functions-internal,
  # which Netlify finds by itself.

[build.environment]
  # Node 20 reached end-of-life 2026-04; 22 is the current LTS.
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund --prefer-offline"
  # The first deploy needs no flag: if the CMS is unreachable the build warns and uses the
  # committed snapshot in src/lib/content/. Once api.achin.uk is public, set
  # REQUIRE_CMS_BUILD = "1" in the Netlify UI (site env, never here) so a stale snapshot
  # can never ship silently.

# ─── Security headers — every response ───────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Clickjacking: the site may never be shown inside a frame.
    X-Frame-Options = "DENY"
    # The browser must trust the declared Content-Type (no MIME sniffing).
    X-Content-Type-Options = "nosniff"
    # Other sites receive only our origin, never the full URL.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # HTTPS only for 2 years, subdomains included. `preload` only matters once the domain is
    # submitted to hstspreload.org — do not submit until every subdomain is permanently HTTPS.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Browser features the site never uses. (FLoC's `interest-cohort` is retired; dropped.)
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Cut the link to cross-origin popup windows.
    Cross-Origin-Opener-Policy = "same-origin"
    # CSP, part 1 of 2: only directives that a <meta> CSP cannot carry or that never
    # touch scripts. Do NOT add default-src or script-src here. Every prerendered page has
    # an inline SvelteKit bootstrap script whose hash changes each build; browsers enforce
    # every CSP they receive, so a header `script-src 'self'` blocks it and all JavaScript
    # (both old versions of this file had that bug). Part 2 — script/style/img/connect
    # rules with per-build hashes — belongs in svelte.config.js › kit.csp (next commit).
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

# ─── Cache ───────────────────────────────────────────────────────
# /_app/immutable/*: the adapter already writes `public, immutable, max-age=31536000` into
# build/_headers. Netlify joins repeated header names with commas (seen on the live site
# 2026-09-15), so a second Cache-Control rule would produce conflicting values — no rule here,
# and no Cache-Control on /* either (it would also land on the immutable files).
# Prerendered HTML: Netlify's default (browsers revalidate; the CDN is purged on every
# deploy) is exactly what a rebuilt static site needs.
# Header name in lowercase on purpose: the adapter writes `cache-control` into build/_headers,
# and Netlify warns when the same header name appears in two different cases anywhere.
[[headers]]
  for = "/favicon.png"
  [headers.values]
    cache-control = "public, max-age=604800"

# ─── /admin: never indexed (its own robots meta is client-side only) ──
# /admin is served by the Netlify function; after the first deploy confirm with
# `curl -sI https://achin.uk/admin` that this header arrives.
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ─── Redirects ───────────────────────────────────────────────────
# adapter-netlify refuses [[redirects]] in this file ("Use _redirects instead"). Rules live
# in _redirects at the repo root: source maps blocked; www → apex enabled on launch day.

# ─── Functions ───────────────────────────────────────────────────
[functions]
  node_bundler = "esbuild"
  # When Stripe (Business features) is wired: external_node_modules = ["stripe"], remove
  # payment=() above, and allow js.stripe.com / api.stripe.com / hooks.stripe.com in kit.csp.
